        const categories = ["JAGER", "VASOS", "CERVEZA", "BOTELLAS", "ENERGETICAS", "TEQUILA", "BEBIDAS Y AGUAS"];
        let curCat = 'ALL';
        let q = '';

        const tabsBox = document.getElementById('tabsBox');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            const count = items.filter(x => x.categoria === cat).length;
            btn.textContent = `${cat} (${count})`;
            btn.onclick = () => setCat(cat);
            tabsBox.appendChild(btn);
        });

        function render() {
            const box = document.getElementById('cardsBox');
            const filtered = items.filter(i => {
                const catOk = curCat === 'ALL' || i.categoria === curCat;
                const searchOk = i.nombre.toLowerCase().includes(q.toLowerCase()) || i.categoria.toLowerCase().includes(q.toLowerCase());
                return catOk && searchOk;
            });

            const targetCats = curCat === 'ALL' ? categories : [curCat];
            let html = '';

            targetCats.forEach(c => {
                const sub = filtered.filter(x => x.categoria === c);
                if (sub.length > 0) {
                    html += `<h2 class="sec-title"><span>✦</span> ${c} (${sub.length})</h2><div class="grid">`;
                    sub.forEach(it => {
                        html += `
                        <div class="card">
                            <div class="card-img-box">
                                <img src="${it.foto}" alt="${it.nombre}" loading="lazy">
                            </div>
                            <div class="card-body">
                                <div class="card-cat">${it.categoria}</div>
                                <div class="card-name">${it.nombre}</div>
                                <div class="card-desc">${it.descripcion}</div>
                                <div class="card-price-raw">
                                    <span>${it.precio}</span>
                                    <span class="tag">Sin Puntos</span>
                                </div>
                                <div class="btn-group">
                                    <button class="btn-act" onclick="copyText('${it.nombre}', 'Nombre copiado: ${it.nombre}')">Copiar Nombre</button>
                                    <button class="btn-act price-btn" onclick="copyText('${it.precio}', 'Precio copiado: ${it.precio}')">Copiar ${it.precio}</button>
                                </div>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
            });

            box.innerHTML = html || '<p style="text-align:center; padding: 40px; color:#888;">No se encontraron productos.</p>';
        }

        function setCat(c) {
            curCat = c;
            document.querySelectorAll('.tab-btn').forEach(b => {
                if (c === 'ALL') {
                    b.classList.toggle('active', b.textContent.startsWith('Todos'));
                } else {
                    b.classList.toggle('active', b.textContent.startsWith(c));
                }
            });
            render();
        }

        function filter() {
            q = document.getElementById('search').value;
            render();
        }

        function copyText(val, msg) {
            navigator.clipboard.writeText(val).then(() => {
                const t = document.getElementById('toast');
                t.textContent = msg || 'Copiado!';
                t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 1800);
            });
        }

        render();
    </script>
