    <style>

        header {

            font-size: 24px; font-weight: 900; letter-spacing: 1px;

        .search-input {

            padding: 10px 18px; border-radius: 999px; color: #fff;
            width: 320px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .search-input:focus { border-color: var(--pink); box-shadow: 0 0 15px var(--pink-glow); }
        .tabs {
            max-width: 1400px; margin: 20px auto 0; padding: 0 24px;
            display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border);
            color: var(--muted); padding: 8px 16px; border-radius: 20px;
            font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s;
        }
        .tab-btn:hover, .tab-btn.active {
            background: var(--pink); color: #fff; border-color: var(--pink);
            box-shadow: 0 4px 15px var(--pink-glow);
        }
        .container { max-width: 1400px; margin: 24px auto; padding: 0 24px; }
        .sec-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px; font-weight: 800; letter-spacing: 0.5px;
            margin: 30px 0 16px; display: flex; align-items: center; gap: 8px; color: #fff;
        }
        .sec-title span { color: var(--pink); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; overflow: hidden;
            display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(232, 33, 124, 0.5);
        }
        .card-img-box {
            width: 100%; height: 160px; background: #000;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .card-img-box img {
            max-width: 90%; max-height: 90%; object-fit: contain;
        }
        .card-body { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-cat { font-size: 11px; font-weight: 700; color: var(--pink); text-transform: uppercase; letter-spacing: 1px; }
        .card-name { font-size: 15px; font-weight: 700; margin: 6px 0 10px; line-height: 1.3; flex-grow: 1; }
        .card-price-raw {
            font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 10px;
            font-family: 'Montserrat', sans-serif;
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-price-raw span.tag {
            font-size: 10px; background: rgba(16, 185, 129, 0.15); color: #34d399;
            padding: 2px 8px; border-radius: 6px; font-weight: 600;
        }
        .btn-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
        }
        .btn-act {
            background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border);
            color: #fff; padding: 7px 4px; border-radius: 6px; font-size: 11px;
            font-weight: 700; cursor: pointer; text-align: center; transition: 0.2s;
        }
        .btn-act:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-act.price-btn {
            background: rgba(232, 33, 124, 0.15); border-color: rgba(232, 33, 124, 0.3); color: #ff65a3;
        }
        .btn-act.price-btn:hover {
            background: var(--pink); color: #fff;
        }
        #toast {
            position: fixed; bottom: 24px; right: 24px;
            background: #10b981; color: #fff;
            padding: 12px 22px; border-radius: 8px;
            font-weight: 700; font-size: 14px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            display: none; z-index: 1000;
        }
    </style>

PÍA 1 PRENDA", "precio": 2000, "foto": "09_ENTRADAS/GUARDARROPÍA_1_PRENDA_$2000.jpg"}, {"id": "913fc155-b403-4b83-ac1d-fff1ebc90b03", "categoria": "ENTRADAS", "nombre": "GENERAL", "precio": 10000, "foto": "09_ENTRADAS/GENERAL_$10000.jpg"}, {"id": "ce7eafd5-dbe5-409b-b3e3-ae548e61c284", "categoria": "ENTRADAS", "nombre": "GOLDEN", "precio": 30000, "foto": "09_ENTRADAS/GOLDEN_$30000.jpg"}, {"id": "ce795615-ab72-4960-9a46-7dd42802abd0", "categoria": "ENTRADAS", "nombre": "ESTACIONAMIENTO MOTO", "precio": 3000, "foto": "09_ENTRADAS/ESTACIONAMIENTO_MOTO_$3000.jpg"}];
        let curCat = 'ALL';
        let q = '';

        const catPriority = ["VASOS", "BOTELLAS", "PROMOS", "COMBOS", "CERVEZA", "JAGER", "TEQUILA", "BEBIDAS Y AGUAS", "ENERGETICAS", "BEBESTIBLES", "MENU", "COVERS", "ENTRADAS"];
        const categories = [...new Set(items.map(x => x.categoria))].sort((a,b) => {
            let ia = catPriority.indexOf(a);
            let ib = catPriority.indexOf(b);
            if (ia === -1) ia = 99;
            if (ib === -1) ib = 99;
            return ia - ib;
        });

        const tabsBox = document.getElementById('tabsBox');
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            const count = items.filter(x => x.categoria === cat).length;
            btn.textContent = `${cat} (${count})`;
            btn.onclick = () => setCat(cat);
            tabsBox.appendChild(btn);
        });

        function render() {
            const box = document.getElementById('cardsBox');
            const filtered = items.filter(i => {
                const catOk = curCat === 'ALL' || i.categoria === curCat;
                const searchOk = i.nombre.toLowerCase().includes(q.toLowerCase()) || i.categoria.toLowerCase().includes(q.toLowerCase());
                return catOk && searchOk;
            });

            const targetCats = curCat === 'ALL' ? categories : [curCat];
            let html = '';

            targetCats.forEach(c => {
                const sub = filtered.filter(x => x.categoria === c);
                if (sub.length > 0) {
                    html += `<h2 class="sec-title"><span>✦</span> ${c} (${sub.length})</h2><div class="grid">`;
                    sub.forEach(it => {
                        html += `
                        <div class="card">
                            <div class="card-img-box">
                                <img src="${it.foto}" alt="${it.nombre}" loading="lazy">
                            </div>
                            <div class="card-body">
                                <div class="card-cat">${it.categoria}</div>
                                <div class="card-name">${it.nombre}</div>
                                <div class="card-price-raw">
                                    <span>${it.precio}</span>
                                    <span class="tag">Sin Puntos</span>
                                </div>
                                <div class="btn-group">
                                    <button class="btn-act" onclick="copyText('${it.nombre}', 'Nombre copiado: ${it.nombre}')">Copiar Nombre</button>
                                    <button class="btn-act price-btn" onclick="copyText('${it.precio}', 'Precio copiado: ${it.precio}')">Copiar ${it.precio}</button>
                                </div>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
            });

            box.innerHTML = html || '<p style="text-align:center; padding: 40px; color:#888;">No se encontraron productos.</p>';
        }

        function setCat(c) {
            curCat = c;
            document.querySelectorAll('.tab-btn').forEach(b => {
                if (c === 'ALL') {
                    b.classList.toggle('active', b.textContent.startsWith('Todos'));
                } else {
                    b.classList.toggle('active', b.textContent.startsWith(c));
                }
            });
            render();
        }

        function filter() {
            q = document.getElementById('search').value;
            render();
        }

        function copyText(val, msg) {
            navigator.clipboard.writeText(val).then(() => {
                const t = document.getElementById('toast');
                t.textContent = msg || 'Copiado!';
                t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 1800);
            });
        }

        render();
    </script>
</body>
</html>
