    function renderGrid(data) {
      const grid = document.getElementById('productsGrid');
      if (data.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-500 text-sm">No se encontraron productos con ese filtro.</div>';
        return;
      }
      grid.innerHTML = data.map(p => {
        const isBotella = p.categoria === 'Botellas';
        return `
          <div class="glow-card card-zoom bg-slate-900/80 border border-slate-800 hover:border-slate-700 rounded-2xl p-3 sm:p-4 flex flex-col justify-between transition-all">
            <div>
              <div class="relative bg-slate-950 rounded-xl overflow-hidden aspect-square flex items-center justify-center mb-3 border border-slate-800/80">
                <img src="${p.rel_path}" alt="${p.nombre}" class="max-h-full max-w-full object-contain transition-transform duration-300" loading="lazy">
                <span class="absolute top-2 left-2 text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md ${isBotella ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-pink-500/20 text-pink-300 border border-pink-500/30'}">
                  ${isBotella ? '🍾 Botella' : '🍸 Vaso'}
                </span>
              </div>
              <div class="text-[10px] font-mono text-slate-500">#${String(p.id).padStart(2, '0')}</div>
              <h3 class="font-bold text-white text-xs sm:text-sm line-clamp-1 mt-0.5" title="${p.nombre}">${p.nombre}</h3>
              <div class="text-base sm:text-lg font-black text-amber-400 mt-1">${p.precio_fmt}</div>
            </div>
            
            <div class="mt-3 pt-2.5 border-t border-slate-800/80 flex gap-1.5">
              <button onclick="copyToClipboard('${p.rel_path}', 'Ruta relativa copiada')" 
                class="flex-1 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[11px] font-semibold transition-colors" title="Copiar ruta relativa">
                📋 Ruta
              </button>
              <a href="${p.rel_path}" download="${p.img_file}" 
                class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-semibold flex items-center justify-center transition-colors" title="Descargar foto">
                💾
              </a>
              <a href="${p.rel_path}" target="_blank" 
                class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-semibold flex items-center justify-center transition-colors" title="Ver en tamaño completo">
                👁️
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    let currentCategory = 'all';

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-pink-600', 'text-white');
        b.classList.add('text-slate-400');
      });
      if (cat === 'all') document.getElementById('btn-all').classList.add('bg-pink-600', 'text-white');
      if (cat === 'Individuales y Vasos') document.getElementById('btn-ind').classList.add('bg-pink-600', 'text-white');
      if (cat === 'Botellas') document.getElementById('btn-bot').classList.add('bg-pink-600', 'text-white');
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = items.filter(p => {
        const matchCat = (currentCategory === 'all' || p.categoria === currentCategory);
        const matchQuery = (!query || p.nombre.toLowerCase().includes(query) || p.precio_fmt.includes(query) || String(p.precio).includes(query));
        return matchCat && matchQuery;
      });
      renderGrid(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);

    function copyToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2200);
      });
    }

    renderGrid(items);
  </script>
