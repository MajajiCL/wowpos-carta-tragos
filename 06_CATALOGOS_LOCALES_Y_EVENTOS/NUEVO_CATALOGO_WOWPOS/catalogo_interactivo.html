<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Oficial WOWPOS • Individuales & Botellas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #e8217c;
            --pink-glow: rgba(232, 33, 124, 0.45);
            --bg: #090a10;
            --card: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --muted: #a0a5b8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 60px; }
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(9, 10, 16, 0.92); backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 18px 24px;
        }
        .header-wrap {
            max-width: 1300px; margin: 0 auto;
            display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
        }
        .brand h1 { font-family: 'Montserrat', sans-serif; font-size: 22px; color: #fff; }
        .brand h1 span { color: var(--pink); }
        .brand p { font-size: 12px; color: var(--muted); }
        .search-input {
            padding: 10px 18px; border-radius: 999px; border: 1px solid var(--border);
            background: rgba(255,255,255,0.06); color: #fff; width: 320px; outline: none; font-size: 14px;
        }
        .search-input:focus { border-color: var(--pink); box-shadow: 0 0 12px var(--pink-glow); }
        .tabs { max-width: 1300px; margin: 24px auto; padding: 0 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .tab-btn {
            padding: 10px 22px; border-radius: 999px; background: var(--card); border: 1px solid var(--border);
            color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 700; transition: all 0.2s;
        }
        .tab-btn.active, .tab-btn:hover { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: 0 0 15px var(--pink-glow); }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 20px; }
        .sec-title { font-family: 'Montserrat', sans-serif; font-size: 21px; color: #fff; margin: 34px 0 18px; display: flex; align-items: center; gap: 10px; }
        .sec-title span { color: var(--pink); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            overflow: hidden; display: flex; flex-direction: column; transition: all 0.25s; cursor: pointer;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--pink); box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 20px var(--pink-glow); }
        .card-img-box {
            width: 100%; height: 210px; background: #13151f; display: flex; align-items: center; justify-content: center; padding: 14px;
        }
        .card-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.6)); }
        .card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .card-name { font-weight: 700; font-size: 15.5px; margin-bottom: 8px; }
        .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
        .card-price { font-family: 'Montserrat', sans-serif; font-size: 19px; font-weight: 900; color: var(--pink); }
        .btn-copy { padding: 6px 12px; border-radius: 6px; background: rgba(232, 33, 124, 0.15); border: 1px solid var(--pink); color: #fff; font-size: 11.5px; font-weight: 700; cursor: pointer; }
        .btn-copy:hover { background: var(--pink); }
        #toast {
            position: fixed; bottom: 30px; right: 30px; background: var(--pink); color: #fff;
            padding: 12px 24px; border-radius: 999px; font-weight: 700; font-size: 13.5px;
            box-shadow: 0 10px 30px var(--pink-glow); display: none; z-index: 1000;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-wrap">
            <div class="brand">
                <h1>WOWPOS • <span>Catálogo JPG</span></h1>
                <p>1. Individuales (22) • 2. Botellas (10)</p>
            </div>
            <input type="text" id="search" class="search-input" placeholder="Buscar por producto..." oninput="filter()">
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="setCat('ALL')">Todos (32)</button>
        <button class="tab-btn" onclick="setCat('INDIVIDUALES')">1. Individuales (22)</button>
        <button class="tab-btn" onclick="setCat('BOTELLAS')">2. Botellas (10)</button>
    </div>

    <div class="container" id="cardsBox"></div>
    <div id="toast">¡Ruta de foto copiada al portapapeles!</div>

    <script>
        const items = [{'id': 'PRD-01', 'categoria': 'INDIVIDUALES', 'item': 'Alto 35° (Vaso)', 'precio': 7000, 'foto': '01_INDIVIDUALES/01_Alto_35_Vaso_$7000.jpg'}, {'id': 'PRD-02', 'categoria': 'INDIVIDUALES', 'item': '2x Alto 35°', 'precio': 13000, 'foto': '01_INDIVIDUALES/02_2x_Alto_35_$13000.jpg'}, {'id': 'PRD-03', 'categoria': 'INDIVIDUALES', 'item': 'Vodka Smirnoff (Vaso)', 'precio': 8000, 'foto': '01_INDIVIDUALES/03_Vodka_Smirnoff_Vaso_$8000.jpg'}, {'id': 'PRD-04', 'categoria': 'INDIVIDUALES', 'item': 'Gin Tanqueray (Copa)', 'precio': 9000, 'foto': '01_INDIVIDUALES/04_Gin_Tanqueray_Copa_$9000.jpg'}, {'id': 'PRD-05', 'categoria': 'INDIVIDUALES', 'item': 'Tropical Monster', 'precio': 10000, 'foto': '01_INDIVIDUALES/05_Tropical_Monster_$10000.jpg'}, {'id': 'PRD-06', 'categoria': 'INDIVIDUALES', 'item': '2x Tropical Monster', 'precio': 18000, 'foto': '01_INDIVIDUALES/06_2x_Tropical_Monster_$18000.jpg'}, {'id': 'PRD-07', 'categoria': 'INDIVIDUALES', 'item': 'Johnnie Walker Red (Vaso)', 'precio': 8000, 'foto': '01_INDIVIDUALES/07_Johnnie_Walker_Red_Vaso_$8000.jpg'}, {'id': 'PRD-08', 'categoria': 'INDIVIDUALES', 'item': '2x Johnnie Walker Red', 'precio': 14000, 'foto': '01_INDIVIDUALES/08_2x_Johnnie_Walker_Red_$14000.jpg'}, {'id': 'PRD-09', 'categoria': 'INDIVIDUALES', 'item': 'Johnnie Walker Black (Vaso)', 'precio': 10000, 'foto': '01_INDIVIDUALES/09_Johnnie_Walker_Black_Vaso_$10000.jpg'}, {'id': 'PRD-10', 'categoria': 'INDIVIDUALES', 'item': 'Fernet (Vaso)', 'precio': 8000, 'foto': '01_INDIVIDUALES/10_Fernet_Vaso_$8000.jpg'}, {'id': 'PRD-11', 'categoria': 'INDIVIDUALES', 'item': 'Shot Jagermeister', 'precio': 6000, 'foto': '01_INDIVIDUALES/11_Shot_Jagermeister_$6000.jpg'}, {'id': 'PRD-12', 'categoria': 'INDIVIDUALES', 'item': 'Jagermeister (Vaso)', 'precio': 8000, 'foto': '01_INDIVIDUALES/12_Jagermeister_Vaso_$8000.jpg'}, {'id': 'PRD-13', 'categoria': 'INDIVIDUALES', 'item': 'Ramazzotti (Copa)', 'precio': 8000, 'foto': '01_INDIVIDUALES/13_Ramazzotti_Copa_$8000.jpg'}, {'id': 'PRD-14', 'categoria': 'INDIVIDUALES', 'item': 'Shot Don Julio Blanco', 'precio': 10000, 'foto': '01_INDIVIDUALES/14_Shot_Don_Julio_Blanco_$10000.jpg'}, {'id': 'PRD-15', 'categoria': 'INDIVIDUALES', 'item': '2x Shot Don Julio Blanco', 'precio': 18000, 'foto': '01_INDIVIDUALES/15_2x_Shot_Don_Julio_Blanco_$18000.jpg'}, {'id': 'PRD-16', 'categoria': 'INDIVIDUALES', 'item': 'Cerveza Heineken', 'precio': 4000, 'foto': '01_INDIVIDUALES/16_Cerveza_Heineken_$4000.jpg'}, {'id': 'PRD-17', 'categoria': 'INDIVIDUALES', 'item': '2x Cerveza Heineken', 'precio': 6000, 'foto': '01_INDIVIDUALES/17_2x_Cerveza_Heineken_$6000.jpg'}, {'id': 'PRD-18', 'categoria': 'INDIVIDUALES', 'item': 'Agua', 'precio': 4000, 'foto': '01_INDIVIDUALES/18_Agua_$4000.jpg'}, {'id': 'PRD-19', 'categoria': 'INDIVIDUALES', 'item': 'Monster', 'precio': 5000, 'foto': '01_INDIVIDUALES/19_Monster_$5000.jpg'}, {'id': 'PRD-20', 'categoria': 'INDIVIDUALES', 'item': 'Bebida (vaso)', 'precio': 3000, 'foto': '01_INDIVIDUALES/20_Bebida_Vaso_$3000.jpg'}, {'id': 'PRD-21', 'categoria': 'INDIVIDUALES', 'item': 'Bebida (lata)', 'precio': 3000, 'foto': '01_INDIVIDUALES/21_Bebida_Lata_$3000.jpg'}, {'id': 'PRD-22', 'categoria': 'INDIVIDUALES', 'item': 'Vaso reutilizable', 'precio': 1000, 'foto': '01_INDIVIDUALES/22_Vaso_Reutilizable_$1000.jpg'}, {'id': 'PRD-23', 'categoria': 'BOTELLAS', 'item': 'Alto 35° (Botella)', 'precio': 70000, 'foto': '02_BOTELLAS/01_Bot_Alto_35_$70000.jpg'}, {'id': 'PRD-24', 'categoria': 'BOTELLAS', 'item': 'Vodka Smirnoff (Botella)', 'precio': 80000, 'foto': '02_BOTELLAS/02_Bot_Vodka_Smirnoff_$80000.jpg'}, {'id': 'PRD-25', 'categoria': 'BOTELLAS', 'item': 'Vodka Grey Goose (Botella)', 'precio': 130000, 'foto': '02_BOTELLAS/03_Bot_Vodka_Grey_Goose_$130000.jpg'}, {'id': 'PRD-26', 'categoria': 'BOTELLAS', 'item': 'Gin Tanqueray (Botella)', 'precio': 90000, 'foto': '02_BOTELLAS/04_Bot_Gin_Tanqueray_$90000.jpg'}, {'id': 'PRD-27', 'categoria': 'BOTELLAS', 'item': 'Johnnie Walker Red (Botella)', 'precio': 80000, 'foto': '02_BOTELLAS/05_Bot_Johnnie_Walker_Red_$80000.jpg'}, {'id': 'PRD-28', 'categoria': 'BOTELLAS', 'item': 'Johnnie Walker Black (Botella)', 'precio': 120000, 'foto': '02_BOTELLAS/06_Bot_Johnnie_Walker_Black_$120000.jpg'}, {'id': 'PRD-29', 'categoria': 'BOTELLAS', 'item': 'Fernet (Botella)', 'precio': 80000, 'foto': '02_BOTELLAS/07_Bot_Fernet_$80000.jpg'}, {'id': 'PRD-30', 'categoria': 'BOTELLAS', 'item': 'Jagermeister (Botella)', 'precio': 80000, 'foto': '02_BOTELLAS/08_Bot_Jagermeister_$80000.jpg'}, {'id': 'PRD-31', 'categoria': 'BOTELLAS', 'item': 'Don Julio 70 (Botella)', 'precio': 250000, 'foto': '02_BOTELLAS/09_Bot_Don_Julio_70_$250000.jpg'}, {'id': 'PRD-32', 'categoria': 'BOTELLAS', 'item': 'Moët & Chandon Brut Imperial (Botella)', 'precio': 250000, 'foto': '02_BOTELLAS/10_Bot_Moet_Chandon_Brut_Imperial_$250000.jpg'}];
        let curCat = 'ALL';
        let q = '';

        function render() {
            const box = document.getElementById('cardsBox');
            const filtered = items.filter(i => {
                const catOk = curCat === 'ALL' || i.categoria === curCat;
                const searchOk = i.item.toLowerCase().includes(q.toLowerCase());
                return catOk && searchOk;
            });

            const cats = curCat === 'ALL' ? ['INDIVIDUALES', 'BOTELLAS'] : [curCat];
            let html = '';

            cats.forEach(c => {
                const sub = filtered.filter(x => x.categoria === c);
                if (sub.length > 0) {
                    const titleText = c === 'INDIVIDUALES' ? '1. INDIVIDUALES (Vasos, Shots, Promos 2X, Cervezas, Bebidas)' : '2. BOTELLAS';
                    html += `<h2 class="sec-title"><span>✦</span> ${titleText} (${sub.length})</h2><div class="grid">`;
                    sub.forEach(it => {
                        html += `
                        <div class="card" onclick="copy('${it.foto}')">
                            <div class="card-img-box">
                                <img src="${it.foto}" alt="${it.item}" loading="lazy">
                            </div>
                            <div class="card-body">
                                <div class="card-name">${it.item}</div>
                                <div class="card-footer">
                                    <div class="card-price">$${it.precio.toLocaleString('es-CL')}</div>
                                    <button class="btn-copy">Copiar</button>
                                </div>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }
            });

            box.innerHTML = html || '<p style="text-align:center; padding: 40px; color:#888;">No se encontraron productos.</p>';
        }

        function setCat(c) {
            curCat = c;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.textContent.includes(c === 'ALL' ? 'Todos' : (c === 'INDIVIDUALES' ? 'Individuales' : 'Botellas')));
            });
            render();
        }

        function filter() {
            q = document.getElementById('search').value;
            render();
        }

        function copy(p) {
            navigator.clipboard.writeText(p).then(() => {
                const t = document.getElementById('toast');
                t.style.display = 'block';
                setTimeout(() => t.style.display = 'none', 2000);
            });
        }

        render();
    </script>
</body>
</html>
